# 복사해서 config/vault.local.yaml 로 사용. 상대 경로는 저장소 루트 기준.
vault_path: D:/obsidian/my-vault
writer: false            # true 여야 apply_change/revert_change 가 동작. 샘플 Vault 검증 전에는 false 유지

# 색인·검색·LLM 전송·read_note 모두에서 제외 (폴더 접두어)
denylist:
  - "04. Resource/Personal"
  # 민감한 개별 노트는 파일 경로로도 지정할 수 있다 (예시):
  # - "05. Archive/회사A/credentials.md"

# 색인만 제외 (링크 해석에는 이름이 쓰임)
index_exclude:
  - "100.Canvas"
  - "200.Excalidraw"
  - "998.Template"
  - "999.Attached"
  - ".restructure-log"
  - ".obsidian"
  - "sortspec.md"

index_db: data/index.sqlite
change_store: data/changes     # 다음 단계(변경 보관소)에서 사용
refresh_interval_sec: 30       # 도구 호출 시 증분 색인 최소 간격
